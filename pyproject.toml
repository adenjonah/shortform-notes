[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelnotes"
version = "0.1.0"
description = "Turn Instagram Reels, TikToks and YouTube Shorts into Markdown notes: caption + transcript + AI summary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["instagram", "reels", "tiktok", "youtube-shorts", "transcription", "obsidian", "markdown", "yt-dlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "httpx>=0.27",
  # Deliberately unpinned: yt-dlp's Instagram extractor breaks and is fixed in
  # point releases. Pinning is how other importers rotted within weeks.
  "yt-dlp",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
all = ["openai>=1.50", "anthropic>=0.40", "mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
reelnotes = "reelnotes.cli:main"

[project.urls]
Homepage = "https://github.com/adenjonah/reel-notes"

[tool.hatch.build.targets.wheel]
packages = ["src/reelnotes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
